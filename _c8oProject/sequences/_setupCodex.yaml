accessibility: Private
comment: |-
  Setup local Codex onboarding for the Flow MCP project.
  Generates or updates the local convertigo-flow-mcp skill under ~/.codex/skills
  and minimally patches ~/.codex/config.toml to register the Flow MCP endpoint.
↓codexHome [variables.RequestableVariable-1780500000001]:
  comment: Optional Codex home directory. Defaults to ~/.codex on the local Studio machine.
  description: Codex home directory. Leave empty to use ~/.codex.
  value: ''
↓mcpUrl [variables.RequestableVariable-1780500000002]:
  comment: Optional Flow MCP URL override. Defaults to the locally resolved /convertigo/api/flow-mcp endpoint.
  description: Convertigo Flow MCP endpoint URL. Leave empty to use the current endpoint.
  value: ''
↓dryRun [variables.RequestableVariable-1780500000003]:
  comment: Set true to preview the generated skill and config patch without writing files.
  description: Preview files and config changes without writing them.
  schemaType: xsd:boolean
  value: false
version: 1
nodes:
  - id: parseRequest
    block: mcp.request
    request: input.request
    out: local.request
  - id: batch
    block: if
    condition: length(local.request) > 0
    then:
      - id: handleBatch
        block: mcp.batch
        request: local.request
        out: local.response
      - id: returnBatch
        block: return
        value: "{{ local.response }}"
  - id: handleSingle
    block: mcp.handle
    request: local.request
    out: local.response
  - id: returnSingle
    block: return
    value: "{{ local.response }}"

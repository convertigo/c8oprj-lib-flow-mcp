version: 1
name: mcp.tool.notFound
private: true
icon: mdi:alert-circle-outline
kind: mcp
description: Builds an MCP unknown-tool error response.
display: tool not found
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: error
    block: mcp.response.error
    request: props.request
    code: -32000
    message: "\"Unknown Flow MCP tool: \" + ((props.request.params && props.request.params.name) || \"\")"
    data:
      code: FLOW_MCP_TOOL_ERROR
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

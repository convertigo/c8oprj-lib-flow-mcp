version: 1
name: mcp.tool.flow.resource.get
private: true
icon: mdi:file-code-outline
kind: mcp
description: Runs the flow-resource-get MCP tool.
display: tool flow-resource-get -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
hooks:
  file: mcp.tool.flow.resource.get.hooks.js
implementation:
  runtime: flow
  file: mcp.tool.flow.resource.get.flow.yaml

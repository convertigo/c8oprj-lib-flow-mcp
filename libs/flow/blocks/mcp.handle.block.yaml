version: 1
name: mcp.handle
private: true
icon: mdi:router-network
kind: mcp
description: Handles one MCP JSON-RPC request object.
display: handle request -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: current
    description: One MCP JSON-RPC request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving one MCP response.
nodes:
  - id: initialize
    block: if
    condition: props.request.method == "initialize"
    then:
      - id: handleInitialize
        block: mcp.initialize
        request: props.request
        out: local.response
      - id: returnInitialize
        block: return
        value: "{{ local.response }}"
  - id: toolsList
    block: if
    condition: props.request.method == "tools/list"
    then:
      - id: handleToolsList
        block: mcp.tools.list
        request: props.request
        out: local.response
      - id: returnToolsList
        block: return
        value: "{{ local.response }}"
  - id: toolsCall
    block: if
    condition: props.request.method == "tools/call"
    then:
      - id: handleToolsCall
        block: mcp.tools.call
        request: props.request
        out: local.response
      - id: returnToolsCall
        block: return
        value: "{{ local.response }}"
  - id: resourcesList
    block: if
    condition: props.request.method == "resources/list"
    then:
      - id: handleResourcesList
        block: mcp.resources.list
        request: props.request
        out: local.response
      - id: returnResourcesList
        block: return
        value: "{{ local.response }}"
  - id: resourcesRead
    block: if
    condition: props.request.method == "resources/read"
    then:
      - id: handleResourcesRead
        block: mcp.resources.read
        request: props.request
        out: local.response
      - id: returnResourcesRead
        block: return
        value: "{{ local.response }}"
  - id: initializedNotification
    block: if
    condition: props.request.method == "notifications/initialized"
    then:
      - id: handleInitializedNotification
        block: mcp.notification
        request: props.request
        out: local.response
      - id: returnInitializedNotification
        block: return
        value: "{{ local.response }}"
  - id: anyNotification
    block: if
    condition: startsWith(props.request.method, "notifications/")
    then:
      - id: handleNotification
        block: mcp.notification
        request: props.request
        out: local.response
      - id: returnNotification
        block: return
        value: "{{ local.response }}"
  - id: methodNotFound
    block: mcp.method.notFound
    request: props.request
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

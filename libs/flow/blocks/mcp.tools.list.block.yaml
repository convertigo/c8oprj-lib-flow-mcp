version: 1
name: mcp.tools.list
private: true
icon: mdi:format-list-bulleted-square
kind: mcp
description: Builds the MCP tools/list response.
display: tools.list -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
hooks:
  file: mcp.tools.list.hooks.js
implementation:
  runtime: flow
  file: mcp.tools.list.flow.yaml

version: 1
name: mcp.tool.flow.block.duplicate
private: true
icon: mdi:content-duplicate
kind: mcp
description: Runs the flow-block-duplicate MCP tool.
display: tool flow-block-duplicate -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: runBlockDuplicate
    block: mcp.tool.run
    request: props.request
    target: block.duplicate
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

version: 1
name: mcp.tool.flow.catalog
private: true
icon: mdi:puzzle-outline
kind: mcp
description: Runs the flow-catalog MCP tool.
display: tool flow-catalog -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: runCatalog
    block: mcp.tool.run
    request: props.request
    target: block.list
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

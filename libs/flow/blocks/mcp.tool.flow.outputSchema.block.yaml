version: 1
name: mcp.tool.flow.outputSchema
private: true
icon: mdi:code-json
kind: mcp
description: Runs the flow-output-schema MCP tool.
display: tool flow-output-schema -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: readFlowOutputSchema
    block: mcp.tool.run
    request: props.request
    target: flow.outputSchema
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

version: 1
nodes:
  - id: availableTools
    block: mcp.tools.available
    out: flow.tools
  - id: payload
    block: json.object
    out: flow.payload
    fields:
      - id: tools
        block: json.field
        key: tools
        value: "{{ flow.tools }}"
  - id: response
    block: mcp.response.result
    request: input.request
    result: flow.payload

version: 1
nodes:
  - id: listResourceFiles
    block: resource.list
    rootDir: libs/flow/resources
    pattern: "**/*.md"
    out: local.resourceList
  - id: filterUri
    block: list.filter
    items: local.resourceList.resources
    where: current.uri == input.request.params.uri
    out: local.matches
  - id: notFound
    block: if
    condition: length(local.matches) == 0
    then:
      - id: error
        block: mcp.response.error
        request: input.request
        code: -32000
        message: "\"Unknown Flow MCP resource: \" + (input.request.params.uri || \"\")"
        data:
          code: FLOW_MCP_RESOURCE_ERROR
        out: local.response
      - id: returnError
        block: return
        value: "{{ local.response }}"
  - id: readResource
    block: resource.get
    path: "{{ local.matches.0.path }}"
    out: local.resource
  - id: content
    block: json.object
    out: local.content
    fields:
      - id: uri
        block: json.field
        key: uri
        value: "{{ local.resource.uri }}"
      - id: mimeType
        block: json.field
        key: mimeType
        value: "{{ local.resource.mimeType }}"
      - id: text
        block: json.field
        key: text
        value: "{{ local.resource.content }}"
  - id: payload
    block: json.object
    out: local.payload
    fields:
      - id: contents
        block: json.field
        key: contents
        value:
          - "{{ local.content }}"
  - id: wrapResult
    block: mcp.response.result
    request: input.request
    result: local.payload

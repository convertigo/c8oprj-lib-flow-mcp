version: 1
nodes:
  - id: listResourceFiles
    block: resource.list
    rootDir: libs/flow/resources
    pattern: "**/*.md"
    out: local.resourceList
  - id: initResources
    block: set
    path: local.resources
    value: []
  - id: eachResource
    block: forEach
    items: local.resourceList.resources
    nodes:
      - id: pushResource
        block: json.push
        path: local.resources
        nodes:
          - id: resourceObject
            block: json.object
            fields:
              - id: uri
                block: json.field
                key: uri
                value: "{{ current.uri }}"
              - id: name
                block: json.field
                key: name
                value: "{{ current.name }}"
              - id: description
                block: json.field
                key: description
                value: "{{ current.description }}"
              - id: mimeType
                block: json.field
                key: mimeType
                value: "{{ current.mimeType }}"
  - id: payload
    block: json.object
    out: local.payload
    fields:
      - id: resources
        block: json.field
        key: resources
        value: "{{ local.resources }}"
  - id: wrapResult
    block: mcp.response.result
    request: input.request
    result: local.payload

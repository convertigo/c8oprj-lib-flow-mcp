version: 1
nodes:
- id: "initResponses"
  block: "set"
  path: "local.responses"
  value: []
- id: "eachRequest"
  block: "forEach"
  items: "input.request"
  nodes:
  - id: "handleRequest"
    block: "mcp.handle"
    request: "current"
    out: "local.response"
  - id: "collectResponse"
    block: "json.push"
    path: "local.responses"
    value: "{{ local.response }}"
- id: "done"
  block: "return"
  value: "{{ local.responses }}"

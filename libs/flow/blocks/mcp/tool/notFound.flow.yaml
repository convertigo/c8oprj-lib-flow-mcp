version: 1
nodes:
  - id: error
    block: mcp.response.error
    request: input.request
    code: -32000
    message: "\"Unknown Flow MCP tool: \" + ((input.request.params && input.request.params.name) || \"\")"
    data:
      code: FLOW_MCP_TOOL_ERROR
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

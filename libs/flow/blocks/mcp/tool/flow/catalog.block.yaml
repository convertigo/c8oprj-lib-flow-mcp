version: 1
private: true
icon: mdi:puzzle-outline
tags:
- mcp
description: Runs the flow-catalog MCP tool.
display: tool flow-catalog -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
hooks:
  file: catalog.hooks.js
implementation:
  runtime: flow
  file: catalog.flow.yaml

version: 1
private: true
icon: mdi:test-tube
tags:
- mcp
description: Runs the flow-test MCP tool.
display: tool flow-test -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
hooks:
  file: test.hooks.js
implementation:
  runtime: flow
  file: test.flow.yaml

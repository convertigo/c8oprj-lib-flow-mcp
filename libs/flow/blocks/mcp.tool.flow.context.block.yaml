version: 1
name: mcp.tool.flow.context
private: true
icon: mdi:graph-outline
kind: mcp
description: Runs the flow-context MCP tool.
display: tool flow-context -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
hooks:
  file: mcp.tool.flow.context.hooks.js
implementation:
  runtime: flow
  file: mcp.tool.flow.context.flow.yaml

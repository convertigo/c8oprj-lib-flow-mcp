version: 1
name: "mcp.response.result"
private: true
icon: "mdi:reply"
package: "lib_flow_mcp"
namespace: "mcp"
description: "Wraps a payload in a JSON-RPC result response."
props:
  request:
    kind: "expression"
    type: "object"
    description: "MCP JSON-RPC request object."
  result:
    kind: "expression"
    type: "object"
    description: "JSON-RPC result payload expression."
  out:
    kind: "path"
    mode: "write"
    description: "Scope path receiving the JSON-RPC response."
implementation:
  runtime: "rhino"
  file: "mcp.response.result.js"

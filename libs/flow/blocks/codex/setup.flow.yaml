version: 1
nodes:
  - id: endpoint
    block: endpoint.current
    out: local.endpoint
  - id: mcpUrl
    block: set
    path: local.mcpUrl
    value: "{{ startsWith(input.mcpUrl, '{{') ? local.endpoint.flowMcpUrl : default(input.mcpUrl, local.endpoint.flowMcpUrl) }}"
  - id: codexHome
    block: path.resolveHome
    path: "{{ startsWith(input.codexHome, '{{') ? '~/.codex' : default(input.codexHome, '~/.codex') }}"
    out: local.codexHome
  - id: skillPath
    block: path.resolveHome
    path: "{{ local.codexHome }}"
    suffix: skills/convertigo-flow-mcp/SKILL.md
    out: local.skillPath
  - id: configPath
    block: path.resolveHome
    path: "{{ local.codexHome }}"
    suffix: config.toml
    out: local.configPath
  - id: skillAsset
    block: asset.read
    path: libs/flow/resources/skills/convertigo-flow-mcp/SKILL.md
    out: local.skillTemplate
  - id: skillMarkdown
    block: template.render
    template: "{{ local.skillTemplate }}"
    out: local.skillMarkdown
  - id: writeSkill
    block: file.writeIfChanged
    path: "{{ local.skillPath }}"
    content: "{{ local.skillMarkdown }}"
    dryRun: input.dryRun == true || input.dryRun == 'true'
    out: local.skillWrite
  - id: patchConfig
    block: toml.ensureSection
    path: "{{ local.configPath }}"
    section: mcp_servers.convertigo-flow
    values:
      url: "{{ local.mcpUrl }}"
      startup_timeout_sec: 60
      enabled: true
    dryRun: input.dryRun == true || input.dryRun == 'true'
    out: local.configPatch
  - id: summary
    block: json.object
    out: local.setup
    fields:
      - id: ok
        block: json.field
        key: ok
        value: true
      - id: skillName
        block: json.field
        key: skillName
        value: ConvertigoFlowMCP
      - id: skillDirectoryName
        block: json.field
        key: skillDirectoryName
        value: convertigo-flow-mcp
      - id: skillStatus
        block: json.field
        key: skillStatus
        value: "{{ local.skillWrite.status }}"
      - id: configStatus
        block: json.field
        key: configStatus
        value: "{{ local.configPatch.status }}"
      - id: configServerName
        block: json.field
        key: configServerName
        value: convertigo-flow
      - id: resolvedCodexHome
        block: json.field
        key: resolvedCodexHome
        value: "{{ local.codexHome }}"
      - id: resolvedMcpUrl
        block: json.field
        key: resolvedMcpUrl
        value: "{{ local.mcpUrl }}"
      - id: skillPath
        block: json.field
        key: skillPath
        value: "{{ local.skillPath }}"
      - id: configPath
        block: json.field
        key: configPath
        value: "{{ local.configPath }}"
      - id: dryRun
        block: json.field
        key: dryRun
        value: "{{ input.dryRun == true || input.dryRun == 'true' }}"
      - id: warnings
        block: json.field
        key: warnings
        value: "{{ local.endpoint.warnings }}"
      - id: nextSteps
        block: json.field
        key: nextSteps
        value:
          - Restart Codex to pick up skill or MCP configuration changes.
          - Start a fresh Codex session and use the convertigo-flow-mcp skill for Flow work.
          - Use the convertigo-flow MCP server for Flow-native project authoring.
  - id: done
    block: return
    value: "{{ local.setup }}"

version: 1
name: mcp.method.notFound
private: true
icon: mdi:alert-circle-outline
kind: mcp
description: Builds a JSON-RPC method-not-found error.
display: method.notFound
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: error
    block: mcp.response.error
    request: props.request
    code: -32601
    message: "\"Method not found: \" + (props.request.method || \"\")"
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

        block: return
        value: "{{ local.response }}"
  - id: nodeEdit
    block: if
    condition: props.request.params && props.request.params.name == "flow-node-edit"
    then:
      - id: runNodeEdit
        block: mcp.tool.flow.node.edit
        request: props.request

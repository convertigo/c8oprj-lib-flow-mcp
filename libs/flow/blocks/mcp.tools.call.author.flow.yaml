      - id: returnNodeDelete
        block: return
        value: "{{ local.response }}"
  - id: nodeDuplicate
    block: if
    condition: props.request.params && props.request.params.name == "flow-node-duplicate"
    then:
      - id: runNodeDuplicate
        block: mcp.tool.flow.node.duplicate
        request: props.request

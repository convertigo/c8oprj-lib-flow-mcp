version: 1
nodes:
  - id: flowList
    block: if
    condition: props.request.params && props.request.params.name == "flow-list"
    then:
      - id: runFlowList
        block: mcp.tool.flow.list
        request: props.request
        out: local.response
      - id: returnFlowList
        block: return
        value: "{{ local.response }}"
  - id: flowGet
    block: if
    condition: props.request.params && props.request.params.name == "flow-get"
    then:
      - id: runFlowGet
        block: mcp.tool.flow.get

version: 1
name: mcp.tool.flow.resource.search
private: true
icon: mdi:file-search-outline
kind: mcp
description: Runs the flow-resource-search MCP tool.
display: tool flow-resource-search -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
implementation:
  runtime: flow
  file: mcp.tool.flow.resource.search.flow.yaml

version: 1
name: mcp.tool.flow.block.test
private: true
icon: mdi:puzzle-check-outline
kind: mcp
description: Runs the flow-block-test MCP tool.
display: tool flow-block-test -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: testFlowBlock
    block: mcp.tool.run
    request: props.request
    target: flow.run
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

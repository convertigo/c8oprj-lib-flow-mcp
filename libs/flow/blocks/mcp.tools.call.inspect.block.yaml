version: 1
name: mcp.tools.call.inspect
private: true
icon: mdi:magnify-scan
kind: mcp
description: Routes Flow inspection MCP tools.
display: tools.call inspect -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
implementation:
  runtime: flow
  file: mcp.tools.call.inspect.flow.yaml

version: 1
name: mcp.tool.flow.analyze
private: true
icon: mdi:chart-timeline-variant
kind: mcp
description: Runs the flow-analyze MCP tool.
display: tool flow-analyze -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: runFlowAnalyze
    block: mcp.tool.run
    request: props.request
    target: flow.analyze
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

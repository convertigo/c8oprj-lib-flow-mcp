version: 1
nodes:
  - id: catalog
    block: if
    condition: props.request.params && props.request.params.name == "flow-catalog"
    then:
      - id: runCatalog
        block: mcp.tool.flow.catalog
        request: props.request
        out: local.response
      - id: returnCatalog
        block: return
        value: "{{ local.response }}"
  - id: analyze
    block: if
    condition: props.request.params && props.request.params.name == "flow-analyze"
    then:
      - id: runAnalyze
        block: mcp.tool.flow.analyze
        request: props.request
        out: local.response
      - id: returnAnalyze
        block: return
        value: "{{ local.response }}"
  - id: search
    block: if
    condition: props.request.params && props.request.params.name == "flow-search"
    then:
      - id: runSearch
        block: mcp.tool.flow.search
        request: props.request
        out: local.response
      - id: returnSearch
        block: return
        value: "{{ local.response }}"
  - id: context
    block: if
    condition: props.request.params && props.request.params.name == "flow-context"
    then:
      - id: runContext
        block: mcp.tool.flow.context
        request: props.request
        out: local.response
      - id: returnContext
        block: return
        value: "{{ local.response }}"
  - id: tree
    block: if
    condition: props.request.params && props.request.params.name == "flow-tree"
    then:
      - id: runTree
        block: mcp.tool.flow.tree
        request: props.request
        out: local.response
      - id: returnTree
        block: return
        value: "{{ local.response }}"
  - id: outputSchema
    block: if
    condition: props.request.params && props.request.params.name == "flow-output-schema"
    then:
      - id: runOutputSchema
        block: mcp.tool.flow.outputSchema
        request: props.request
        out: local.response
      - id: returnOutputSchema
        block: return
        value: "{{ local.response }}"
  - id: unknown
    block: mcp.tool.notFound
    request: props.request
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

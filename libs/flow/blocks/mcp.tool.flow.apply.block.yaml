version: 1
name: mcp.tool.flow.apply
private: true
icon: mdi:source-branch-sync
kind: mcp
description: Runs the flow-apply MCP tool.
display: tool flow-apply -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: applyFlowMutation
    block: mcp.tool.run
    request: props.request
    target: flow.apply
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

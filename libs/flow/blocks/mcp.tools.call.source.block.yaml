version: 1
name: mcp.tools.call.source
private: true
icon: mdi:file-code-outline
kind: mcp
description: Routes Flow source/resource MCP tools.
display: tools.call source -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
nodes:
  - id: resourceSearch
    block: if
    condition: props.request.params && props.request.params.name == "flow-resource-search"
    then:
      - id: runResourceSearch
        block: mcp.tool.flow.resource.search
        request: props.request
        out: local.response
      - id: returnResourceSearch
        block: return
        value: "{{ local.response }}"
  - id: resourceGet
    block: if
    condition: props.request.params && props.request.params.name == "flow-resource-get"
    then:
      - id: runResourceGet
        block: mcp.tool.flow.resource.get
        request: props.request
        out: local.response
      - id: returnResourceGet
        block: return
        value: "{{ local.response }}"
  - id: resourcePatch
    block: if
    condition: props.request.params && props.request.params.name == "flow-resource-patch"
    then:
      - id: runResourcePatch
        block: mcp.tool.flow.resource.patch
        request: props.request
        out: local.response
      - id: returnResourcePatch
        block: return
        value: "{{ local.response }}"
  - id: blockList
    block: if
    condition: props.request.params && props.request.params.name == "flow-block-list"
    then:
      - id: runBlockList
        block: mcp.tool.flow.block.list
        request: props.request
        out: local.response
      - id: returnBlockList
        block: return
        value: "{{ local.response }}"
  - id: blockGet
    block: if
    condition: props.request.params && props.request.params.name == "flow-block-get"
    then:
      - id: runBlockGet
        block: mcp.tool.flow.block.get
        request: props.request
        out: local.response
      - id: returnBlockGet
        block: return
        value: "{{ local.response }}"
  - id: blockCreate
    block: if
    condition: props.request.params && props.request.params.name == "flow-block-create"
    then:
      - id: runBlockCreate
        block: mcp.tool.flow.block.create
        request: props.request
        out: local.response
      - id: returnBlockCreate
        block: return
        value: "{{ local.response }}"
  - id: blockDuplicate
    block: if
    condition: props.request.params && props.request.params.name == "flow-block-duplicate"
    then:
      - id: runBlockDuplicate
        block: mcp.tool.flow.block.duplicate
        request: props.request
        out: local.response
      - id: returnBlockDuplicate
        block: return
        value: "{{ local.response }}"
  - id: blockEdit
    block: if
    condition: props.request.params && props.request.params.name == "flow-block-edit"
    then:
      - id: runBlockEdit
        block: mcp.tool.flow.block.edit
        request: props.request
        out: local.response
      - id: returnBlockEdit
        block: return
        value: "{{ local.response }}"
  - id: typeList
    block: if
    condition: props.request.params && props.request.params.name == "flow-type-list"
    then:
      - id: runTypeList
        block: mcp.tool.flow.type.list
        request: props.request
        out: local.response
      - id: returnTypeList
        block: return
        value: "{{ local.response }}"
  - id: typeGet
    block: if
    condition: props.request.params && props.request.params.name == "flow-type-get"
    then:
      - id: runTypeGet
        block: mcp.tool.flow.type.get
        request: props.request
        out: local.response
      - id: returnTypeGet
        block: return
        value: "{{ local.response }}"
  - id: typeCreate
    block: if
    condition: props.request.params && props.request.params.name == "flow-type-create"
    then:
      - id: runTypeCreate
        block: mcp.tool.flow.type.create
        request: props.request
        out: local.response
      - id: returnTypeCreate
        block: return
        value: "{{ local.response }}"
  - id: unknown
    block: mcp.tool.notFound
    request: props.request
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

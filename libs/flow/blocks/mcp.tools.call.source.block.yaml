version: 1
name: mcp.tools.call.source
private: true
icon: mdi:file-code-outline
kind: mcp
description: Routes Flow source/resource MCP tools.
display: tools.call source -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
implementation:
  runtime: flow
  file: mcp.tools.call.source.flow.yaml

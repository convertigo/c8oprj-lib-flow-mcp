version: 1
name: mcp.tools.call
private: true
icon: mdi:tools
kind: mcp
description: Dispatches one MCP tools/call request by visible tool family.
display: tools.call -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
implementation:
  runtime: flow
  file: mcp.tools.call.flow.yaml

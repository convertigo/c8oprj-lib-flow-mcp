version: 1
name: mcp.tools.call
private: true
icon: mdi:tools
kind: mcp
description: Dispatches one MCP tools/call request by visible tool family.
display: tools.call -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
nodes:
  - id: identifyTool
    block: mcp.tool.identify
    request: props.request
    out: local.tool
  - id: inspectTools
    block: if
    condition: local.tool.group == "inspect"
    then:
      - id: callInspectTool
        block: mcp.tools.call.inspect
        request: props.request
        out: local.response
      - id: returnInspectTool
        block: return
        value: "{{ local.response }}"
  - id: sourceTools
    block: if
    condition: local.tool.group == "source"
    then:
      - id: callSourceTool
        block: mcp.tools.call.source
        request: props.request
        out: local.response
      - id: returnSourceTool
        block: return
        value: "{{ local.response }}"
  - id: authorTools
    block: if
    condition: local.tool.group == "author"
    then:
      - id: callAuthorTool
        block: mcp.tools.call.author
        request: props.request
        out: local.response
      - id: returnAuthorTool
        block: return
        value: "{{ local.response }}"
  - id: runtimeTools
    block: if
    condition: local.tool.group == "runtime"
    then:
      - id: callRuntimeTool
        block: mcp.tools.call.runtime
        request: props.request
        out: local.response
      - id: returnRuntimeTool
        block: return
        value: "{{ local.response }}"
  - id: fallbackTool
    block: mcp.tool.notFound
    request: props.request
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

version: 1
name: mcp.tool.flow.get
private: true
icon: mdi:sitemap
kind: mcp
description: Runs the flow-get MCP tool.
display: tool flow-get -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
implementation:
  runtime: flow
  file: mcp.tool.flow.get.flow.yaml

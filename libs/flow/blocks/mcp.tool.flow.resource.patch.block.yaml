version: 1
name: mcp.tool.flow.resource.patch
private: true
icon: mdi:file-edit-outline
kind: mcp
description: Runs the flow-resource-patch MCP tool.
display: tool flow-resource-patch -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: local.response
    description: Scope path receiving the MCP response.
nodes:
  - id: runResourcePatch
    block: mcp.tool.run
    request: props.request
    target: resource.patch
    out: local.response
  - id: done
    block: return
    value: "{{ local.response }}"

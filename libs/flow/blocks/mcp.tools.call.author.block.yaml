version: 1
name: mcp.tools.call.author
private: true
icon: mdi:pencil-ruler
kind: mcp
description: Routes Flow authoring MCP tools.
display: tools.call author -> {{ props.out }}
props:
  request:
    kind: expression
    type: object
    default: input.request
    description: MCP JSON-RPC tools/call request object.
  out:
    kind: path
    mode: write
    default: flow.response
    description: Scope path receiving the MCP response.
implementation:
  runtime: flow
  file: mcp.tools.call.author.flow.yaml
